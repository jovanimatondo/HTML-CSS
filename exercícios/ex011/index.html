<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir este site em vários dipositivos diferentes ou simplesmente aumentar ou diminuir o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 700px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
        
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio src="midia/meu-audio.mp3" autoplay controls loop>
        
    </audio>

    <h2>Agora podes fazer o download do áudio!</h2>
    <a href="midia/meu-audio.mp3" download="meu-audio.mp3" type="audio/mpeg">
        Clique aqui!
    </a>

</body>
</html>
