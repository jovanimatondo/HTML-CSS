<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            
        }
        h1 {
            
            background-color: #d3d3d3;
            width: 300px;
            height: 300px;

          /* 
            border-width: 8px;
            border-style: solid;
            border-color: #2f4f4f;
          */  

          border: 10px solid #2f4f4f; 

          /* 
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
         */

             padding: 10px;
 
         /* margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;
        */

            margin: 10px auto 10px auto;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: #1d1e58;
        }
        a {
            border-width: 5px;
            border-style: solid;
            border-color: #0000ff;
            text-decoration: none;
            color: #b8860b;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">Links são exemplos de caixas inline-level cai</a>vamos ver como tudo isso funciona.
    </p>
    
</body>
</html>
