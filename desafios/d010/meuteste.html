<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testestando margens</title>
    <style>
        body {
            background-color: lightgreen;
        }
        div {
            background-color: darkgray;
            width: 500px;
            height: 500px;
            margin: auto;
            border-radius: 10px;
        }
        div p {
            font-size: 1em;
            text-align: center;
            padding: 50px;
            padding-top: 250px;
            padding-bottom: 2px;
            
        }
        div p:hover {
            background-color: blue;
            color: white;
            border-radius: 10px;
            transition-duration: .5s;
            
        }
    </style>
</head>
<body>
    <h1>Margens negativas</h1>
    <div>
            <p><strong>Exemplo de caixa</strong></p>
    </div>
    
</body>
</html>
